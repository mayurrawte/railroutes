name: Publish to npm

# Publishes the core and every @railroute-ts/* data package that is not already
# on npm at its package.json version. Auth via npm OIDC trusted publishing — link
# each package on npmjs.com (Access → Trusted Publisher: GitHub Actions, repo
# mayurrawte/railroutes, workflow publish.yml, environment EMPTY). No tokens.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - railroute-ts
          - packages/europe
          - packages/india
          - packages/north-america
          - packages/china
          - packages/cis
          - examples/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # NOTE: no registry-url — its _authToken placeholder disables OIDC.
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build -w railroute-ts
      - run: npm run build --workspaces --if-present
      - run: npm test --workspaces --if-present
      - name: Publish if this version is not on npm yet
        working-directory: ${{ matrix.workspace }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published — skipping"
          else
            npm publish --provenance --access public
          fi
