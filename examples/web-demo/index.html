<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>railroute-ts — interactive rail routing demo</title>
    <meta name="description" content="Click two points anywhere in Europe and get the shortest rail route over the OpenStreetMap railway network. Powered by railroute-ts." />
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <h1>railroute-ts</h1>
      <p class="sub">Click two points in Europe → shortest <em>rail</em> route.<br/>
        <a href="https://github.com/mayurrawte/railroutes" target="_blank" rel="noopener">GitHub</a> ·
        <a href="https://www.npmjs.com/package/railroute-ts" target="_blank" rel="noopener">npm</a></p>
      <div id="presets"></div>
      <label class="alt-toggle"><input type="checkbox" id="alts" /> show 2 alternatives</label>
      <div id="result">Pick a preset or click the map twice.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
